<title>Booking LO Wisuda SBM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: tiket pertunjukan di dinding plester Santorini. Tiket = objek utama, biru tinta untuk aksi, bougainvillea hanya di tepi. */
:root{
  --paper:#F4F1E8; --plaster:#FFFDF7; --plaster-2:#F8F4EA;
  --ink:#14215A; --ink-2:#4A5482; --ink-3:#7F88AE;
  --blue:#2443B0; --blue-deep:#16287C; --on-blue:#FFFDF7;
  --sky:#C9E2F6; --sand:#E2D2B2; --pink:#E0447D; --rose:#B4466A; --leaf:#5F8E5B;
  --band-1:#1A3496; --band-2:#3D74D3; --band-3:#9BCDF1; --band-text:#FFFDF7;
  --sun-1:#F7C98B; --sun-2:#F3E3C4; --sea:#2E5DB0;
  --line:#E3DCCB; --line-2:#CFC6B1;
  --ok:#1D7550; --ok-bg:#E2F2E8; --warn:#8F5600; --warn-bg:#FBEFD5; --danger:#B0233A; --danger-bg:#FBE3E7;
  --shadow:rgba(20,33,90,.16); --scrim:rgba(14,22,60,.45);
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-s:8px; --r-m:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0A1230; --plaster:#121C45; --plaster-2:#0F183C;
  --ink:#EDF0FB; --ink-2:#B2BADA; --ink-3:#7C86B0;
  --blue:#86A3FF; --blue-deep:#2D47AE; --on-blue:#0A1230;
  --sky:#18275E; --sand:#3B3B58; --pink:#FF6E9F; --rose:#E27D9F; --leaf:#5E8C62;
  --band-1:#172A7E; --band-2:#3253C2; --band-3:#5E8BE0; --band-text:#F4F6FF;
  --sun-1:#E9A86A; --sun-2:#3A3D73; --sea:#1D3B86;
  --line:#25326A; --line-2:#34437F;
  --ok:#62D3A1; --ok-bg:#0F3A2B; --warn:#F2B654; --warn-bg:#3A2A0C; --danger:#FF8494; --danger-bg:#3E1521;
  --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0A1230; --plaster:#121C45; --plaster-2:#0F183C;
  --ink:#EDF0FB; --ink-2:#B2BADA; --ink-3:#7C86B0;
  --blue:#86A3FF; --blue-deep:#2D47AE; --on-blue:#0A1230;
  --sky:#18275E; --sand:#3B3B58; --pink:#FF6E9F; --rose:#E27D9F; --leaf:#5E8C62;
  --band-1:#172A7E; --band-2:#3253C2; --band-3:#5E8BE0; --band-text:#F4F6FF;
  --sun-1:#E9A86A; --sun-2:#3A3D73; --sea:#1D3B86;
  --line:#25326A; --line-2:#34437F;
  --ok:#62D3A1; --ok-bg:#0F3A2B; --warn:#F2B654; --warn-bg:#3A2A0C; --danger:#FF8494; --danger-bg:#3E1521;
  --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1100px 380px at 50% -120px,var(--sky),transparent 75%),var(--paper);color:var(--ink);font:400 15px/1.55 var(--f-body);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font:600 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}

/* Bar pratinjau (bukan bagian aplikasi) */
.pv{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);color:var(--paper);padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px}
.pv b{font-family:var(--f-mono);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px;margin-right:4px}
.pv button{background:transparent;border:1px solid color-mix(in srgb,var(--paper) 35%,transparent);color:var(--paper);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.pv button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.pv .sp{flex:1}

.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:24px 0}
.narrow{max-width:560px;margin:0 auto}

/* Tiket */
.tk-shadow{filter:drop-shadow(0 8px 16px var(--shadow))}
.ticket{--r:6px;--step:20px;position:relative;background:var(--plaster);
  -webkit-mask:radial-gradient(circle at 0 50%,#0000 var(--r),#000 calc(var(--r) + .5px)) 0 0/51% var(--step) repeat-y,radial-gradient(circle at 100% 50%,#0000 var(--r),#000 calc(var(--r) + .5px)) 100% 0/51% var(--step) repeat-y;
          mask:radial-gradient(circle at 0 50%,#0000 var(--r),#000 calc(var(--r) + .5px)) 0 0/51% var(--step) repeat-y,radial-gradient(circle at 100% 50%,#0000 var(--r),#000 calc(var(--r) + .5px)) 100% 0/51% var(--step) repeat-y}
.stars{color:var(--rose);letter-spacing:.5em;font-size:13px;line-height:1}
.band{background:linear-gradient(180deg,var(--band-1) 0%,var(--band-1) 42%,var(--band-2) 78%,var(--band-3) 100%);color:var(--band-text);font-family:var(--f-display);font-stretch:75%;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.rule{display:flex;align-items:center;gap:8px;color:var(--blue)}
.rule::before,.rule::after{content:"";flex:1;height:1.5px;background:currentColor}
.meta3{display:grid;grid-template-columns:1fr 1.3fr 1fr;text-align:center;color:var(--blue);font:600 13px/1.25 var(--f-display)}
.meta3>div{padding:10px 6px}
.meta3>div+div{border-left:1.5px solid var(--blue)}

/* Beranda */
.home{display:grid;gap:22px;justify-items:center;padding-block:8px 32px}
.home h1{font-size:clamp(34px,8vw,54px);font-stretch:80%;font-weight:800;color:var(--ink);text-align:center}
.home .lead{max-width:44ch;text-align:center;color:var(--ink-2);margin:0}
.big-ticket{width:min(100%,560px);border:0;padding:0;background:none;cursor:pointer;text-align:left;transition:transform .2s}
.big-ticket:hover{transform:translateY(-3px) rotate(-.4deg)}
.big-ticket .ticket{padding:18px 30px 16px;display:grid;gap:12px}
.big-ticket .band{font-size:clamp(46px,13vw,84px);line-height:.95;text-align:center;padding:14px 8px 18px}
.big-ticket .cta{display:flex;justify-content:space-between;align-items:center;font:600 14px var(--f-body);color:var(--blue)}
.stub-btn{border:0;padding:0;background:none;cursor:pointer;transition:transform .2s}
.stub-btn:hover{transform:translateY(-2px) rotate(.6deg)}
.stub-btn .ticket{--r:5px;--step:16px;padding:12px 26px;display:flex;align-items:center;gap:12px;color:var(--ink)}
.stub-btn .ticket b{font:700 17px var(--f-display);font-stretch:85%;text-transform:uppercase;letter-spacing:.04em;color:var(--blue)}
.home-foot{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--ink-3)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}

.flora{position:fixed;pointer-events:none;z-index:0;width:min(34vw,260px);opacity:.95}
.flora.tl{top:30px;left:-30px}
.flora.br{bottom:30px;right:-36px;transform:rotate(180deg)}
.app{position:relative;z-index:1}
.tiles{display:block;width:100%;height:34px;margin-top:40px}

/* Kartu & form */
.card{background:var(--plaster);border:1px solid var(--line);border-radius:var(--r-m);padding:20px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.f{display:grid;gap:6px;font-weight:600;font-size:13.5px}
.inp{width:100%;background:var(--plaster-2);border:1.5px solid var(--line-2);border-radius:var(--r-s);padding:11px 12px;font-size:15px;min-width:0}
.inp:focus{border-color:var(--blue);outline:none}
textarea.inp{min-height:84px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:99px;border:1.5px solid var(--blue);background:var(--blue);color:var(--on-blue);font-weight:600;padding:9px 18px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--blue-deep);border-color:var(--blue-deep);color:var(--band-text)}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.ghost:hover{background:color-mix(in srgb,var(--blue) 10%,transparent);color:var(--blue)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.block{width:100%;padding:12px 18px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 16px;border-radius:99px;border:1.5px solid var(--line-2);background:var(--plaster);font-weight:600;cursor:pointer}
.gbtn:hover{border-color:var(--blue)}
.note{border-radius:var(--r-s);padding:10px 12px;font-size:13.5px;line-height:1.45}
.note.err{background:var(--danger-bg);color:var(--danger)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.info{background:color-mix(in srgb,var(--sky) 60%,var(--plaster));color:var(--ink)}
.back{background:none;border:0;color:var(--ink-2);cursor:pointer;padding:0;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font:600 11.5px/1.6 var(--f-mono);letter-spacing:.03em;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--danger-bg);color:var(--danger)} .pill.neu{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue)}
.pill.full{background:var(--rose);color:var(--plaster)}

/* Prodi */
.prodi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.prodi{border:0;background:none;padding:0;cursor:pointer;text-align:left}
.prodi .ticket{padding:20px 28px;display:grid;gap:8px;min-height:150px;transition:transform .2s}
.prodi:hover .ticket{transform:translateY(-2px)}
.prodi .code{font:600 12px var(--f-mono);color:var(--rose);letter-spacing:.1em}
.prodi h3{font-size:30px;font-stretch:80%;font-weight:800;color:var(--blue);text-transform:uppercase}

/* Login */
.login{display:grid;grid-template-columns:1fr;gap:18px}
.port{width:120px;height:120px;border-radius:50%;overflow:hidden;border:4px solid var(--plaster);box-shadow:0 6px 18px var(--shadow);flex:none}

/* Dashboard */
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.dash-head h1{font-size:clamp(28px,6vw,40px);font-stretch:82%;font-weight:800}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr);gap:20px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:r}
.rules li{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:14px;counter-increment:r}
.rules li::before{content:counter(r);width:24px;height:24px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font:600 12px var(--f-mono)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.cd>div{background:var(--plaster-2);border:1px solid var(--line);border-radius:var(--r-s);text-align:center;padding:8px 2px 6px}
.cd b{display:block;font:600 24px/1 var(--f-mono);color:var(--blue);font-variant-numeric:tabular-nums}
.cd span{font-size:11px;color:var(--ink-3)}
.status .ticket{padding:16px 26px;display:grid;gap:10px}
.status .band{font-size:28px;line-height:1.05;padding:10px 12px 12px;border-radius:2px}
.status.empty .band{background:repeating-linear-gradient(135deg,var(--plaster-2) 0 10px,var(--line) 10px 11px);color:var(--ink-3)}
.perf{border-top:2px dashed var(--line-2);margin:4px -26px 0;padding:10px 26px 0}

.list-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.list-head h2{font-size:24px;font-stretch:85%;font-weight:800;margin-right:auto}
.search{position:relative;flex:1 1 260px;min-width:0}
.search .inp{padding-left:36px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line-2);background:transparent;border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--on-blue)}
.lo-list{display:grid;gap:8px}
.lo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--plaster);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.lo.mine{border-color:var(--blue);box-shadow:inset 4px 0 0 var(--blue)}
.lo.isfull{background:var(--plaster-2)}
.lo-name{font-weight:600;font-size:15px}
.lo-sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);grid-column:1/-1}
.seats{display:inline-flex;gap:3px;vertical-align:middle}
.seats i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--blue)}
.seats i.on{background:var(--blue)}
.seats i.over{background:var(--pink);border-color:var(--pink)}
.who{display:inline-flex;flex-wrap:wrap;gap:4px}
.who span{background:var(--plaster-2);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px;color:var(--ink)}
.who span.hit,.lo-name mark{background:color-mix(in srgb,var(--pink) 22%,transparent);color:inherit;border-color:var(--pink)}
mark{background:color-mix(in srgb,var(--pink) 22%,transparent);color:inherit;border-radius:3px}
.empty-list{padding:28px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line-2);border-radius:var(--r-m)}
.sec{margin-top:28px}
.sec>h2{font-size:24px;font-stretch:85%;font-weight:800;margin-bottom:6px}
.tag-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue);border-radius:99px;padding:3px 6px 3px 10px;font-size:13px;font-weight:500}
.tag button{border:0;background:none;color:inherit;cursor:pointer;padding:0 4px;font-size:15px;line-height:1}
.sugg{display:grid;border:1px solid var(--line);border-radius:var(--r-s);background:var(--plaster);max-height:200px;overflow:auto}
.sugg button{text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.sugg button:hover{background:var(--plaster-2)}
.req{border:1px solid var(--line);border-radius:var(--r-m);padding:14px;display:grid;gap:8px;background:var(--plaster)}
.req .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;font-size:13.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}

/* Tabel & panel */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--plaster)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--plaster-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1.5px solid var(--line);margin-bottom:18px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--ink-2);font-weight:600;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.tabs .count{font:500 11px var(--f-mono);background:var(--pink);color:var(--plaster);border-radius:99px;padding:0 6px;margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--plaster);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;display:grid;gap:6px}
.stat .n{font:600 30px/1 var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.stat .n small{font-size:15px;color:var(--ink-3)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.hist{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:130px;padding-top:8px}
.hist>div{display:grid;gap:4px;justify-items:center;align-content:end;height:100%}
.hist .col{width:100%;max-width:46px;background:var(--blue);border-radius:6px 6px 0 0;min-height:2px}
.hist .col.over{background:var(--pink)}
.hist .v{font:600 12px var(--f-mono)} .hist .l{font-size:11.5px;color:var(--ink-3)}

/* Modal & toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:end center;padding:16px}
@media (min-width:640px){.scrim{place-items:center}}
.sheet{background:var(--plaster);border-radius:18px;padding:22px;width:min(100%,460px);display:grid;gap:14px;box-shadow:0 20px 50px var(--shadow);max-height:90vh;overflow:auto}
.sheet h3{font-size:24px;font-stretch:85%;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px var(--shadow)}
.spin{width:16px;height:16px;border:2px solid var(--line-2);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  .big-ticket .ticket{padding:14px 20px}
  .meta3{font-size:11.5px}
  .flora{width:150px;opacity:.75}
  .kv{grid-template-columns:90px minmax(0,1fr)}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="bract">
      <path d="M0 0 C-9 -6 -12 -18 -4 -24 C0 -27 4 -26 6 -22 C10 -14 6 -6 0 0Z" class="pt1"/>
      <path d="M0 0 C-9 -6 -12 -18 -4 -24 C0 -27 4 -26 6 -22 C10 -14 6 -6 0 0Z" class="pt2" transform="rotate(120)"/>
      <path d="M0 0 C-9 -6 -12 -18 -4 -24 C0 -27 4 -26 6 -22 C10 -14 6 -6 0 0Z" class="pt1" transform="rotate(240)"/>
      <circle r="2.4" class="pc"/>
    </g>
    <path id="leaf" d="M0 0 C6 -8 18 -10 26 -4 C18 4 6 6 0 0Z" class="lf"/>
  </defs>
</svg>
<style>
.pt1{fill:var(--pink)} .pt2{fill:color-mix(in srgb,var(--pink) 78%,var(--plaster))} .pc{fill:var(--sun-2)} .lf{fill:var(--leaf)}
.az-bg{fill:var(--plaster)} .az-a{fill:none;stroke:var(--blue);stroke-width:1.6} .az-b{fill:var(--blue)} .az-c{fill:color-mix(in srgb,var(--blue) 30%,var(--plaster))}
</style>

<div class="pv" role="toolbar" aria-label="Kontrol pratinjau">
  <b>Pratinjau desain</b>
  <button data-act="pv-home">Beranda</button>
  <button data-act="pv-wis">Dashboard wisudawan</button>
  <button data-act="pv-lo">Halaman LO</button>
  <button data-act="pv-admin">Panel panitia</button>

const port=`<svg class="port" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--band-3)"/><stop offset=".55" style="stop-color:var(--sun-2)"/><stop offset="1" style="stop-color:var(--sun-1)"/></linearGradient></defs><rect width="120" height="74" fill="url(#sk)"/><circle cx="60" cy="72" r="14" style="fill:var(--sun-1)"/><rect y="72" width="120" height="48" style="fill:var(--sea)"/><path d="M14 80h30M70 88h36M30 98h24" style="stroke:var(--sun-1);stroke-width:2;opacity:.7"/><path d="M84 70l0-22 12 20z M82 70l0-16-8 14z" style="fill:var(--ink)"/><path d="M72 72h28l-4 4H76z" style="fill:var(--ink)"/></svg>`;

function rowLO(lo,me,q){
  const m=membersOf(lo.id),n=m.length,c=cap(lo),full=n>=c,mine=me&&S.assign.get(me.nim)?.lo===lo.id;
  const myA=me&&S.assign.get(me.nim);const fixed=myA&&myA.src!=="sendiri";
  let btn;
  if(mine)btn=`<span class="pill neu">LO kamu</span>`;
  else if(locked())btn=`<button class="btn sm ghost" disabled>Terkunci</button>`;
  else if(full)btn=`<span class="pill full">Penuh</span>`;
  else if(fixed)btn=`<button class="btn sm ghost" disabled title="LO kamu ditetapkan panitia">Pilih</button>`;
  else btn=`<button class="btn sm${myA?" ghost":""}" data-act="pick" data-lo="${lo.id}">${myA?"Pindah ke sini":"Pilih"}</button>`;
  return `<div class="lo${mine?" mine":""}${full&&!mine?" isfull":""}">
    <div class="lo-name">${hl(lo.nama,q)}</div><div>${btn}</div>
    <div class="lo-sub">${seats(n,c)}<span class="mono">${n}/${c}</span>
      ${n?`<span class="who">${m.map(x=>`<span class="${q&&x.nama.toLowerCase().includes(q.toLowerCase())?"hit":""}">${esc(x.nama.split(" ").slice(0,2).join(" "))}</span>`).join("")}</span>`:`<span class="faint">Belum ada yang memilih</span>`}
    </div></div>`}
function listLOs(){const me=S.me;const him=PRODI[me.prodi].him;const q=S.q.trim();
  let arr=LOS.filter(l=>l.him===him);
  if(q)arr=arr.filter(l=>l.nama.toLowerCase().includes(q.toLowerCase())||membersOf(l.id).some(x=>x.nama.toLowerCase().includes(q.toLowerCase())));
  if(S.flt==="slot")arr=arr.filter(l=>loadOf(l.id)<cap(l));
  if(S.flt==="kosong")arr=arr.filter(l=>loadOf(l.id)===0);
  const mineId=S.assign.get(me.nim)?.lo;arr.sort((a,b)=>(b.id===mineId)-(a.id===mineId));
  return arr.length?arr.map(l=>rowLO(l,me,q)).join(""):`<div class="empty-list">Tidak ada LO atau teman dengan nama "${esc(q)}".<br><span class="faint">Coba nama depan saja, misalnya "Rafa".</span></div>`}

function vDash(){const me=S.me,p=PRODI[me.prodi],a=S.assign.get(me.nim),lo=a&&LBY[a.lo];
  const mates=lo?membersOf(lo.id).filter(x=>x.nim!==me.nim):[];
  const myReqs=S.reqs.filter(r=>r.by===me.nim||r.teman.includes(me.nim));
  const free=LOS.filter(l=>l.him===p.him&&loadOf(l.id)<cap(l)).length;
  return `<div class="wrap">
  <div class="dash-head"><div><div class="eyebrow">${p.nama} · LO ${p.him}</div><h1>Halo, ${esc(first(me.nama))}</h1>
    <div class="muted" style="font-size:13.5px"><span class="mono">${me.nim}</span> · ${esc(me.nama)}</div></div>
    <button class="btn ghost sm" data-act="logout">Keluar</button></div>
  ${locked()?`<div class="note warn" style="margin-bottom:16px"><b>Pemilihan sudah ditutup.</b> ${lo?"LO kamu sudah tercatat di bawah.":"Panitia akan memilihkan LO untukmu dan hasilnya akan muncul di halaman ini."}</div>`:""}
  <div class="grid2">
    <div class="stack" style="gap:18px">
      <div class="status tk-shadow ${lo?"":"empty"}"><div class="ticket">
        <div class="row" style="justify-content:space-between"><span class="eyebrow">Status</span><span class="stars">★ ★ ★</span></div>
        ${lo?`<div class="band">${esc(lo.nama)}</div>
          <div style="font-size:13.5px"><span class="muted">Didampingi bersama:</span> ${mates.length?mates.map(x=>esc(x.nama)).join(", "):'<span class="faint">belum ada, ajak temanmu</span>'}</div>
          <div class="perf row" style="justify-content:space-between"><span class="pill ${a.src==="sendiri"?"neu":"ok"}">${SRC[a.src]}</span>
          ${a.src==="sendiri"&&!locked()?`<button class="btn danger sm" data-act="cancel">Batalkan pilihan</button>`:a.src!=="sendiri"?`<span class="faint" style="font-size:12.5px">Ditetapkan panitia. Hubungi panitia untuk perubahan.</span>`:""}</div>`
        :`<div class="band">Belum memilih LO</div><div class="muted" style="font-size:13.5px">${free} LO ${p.him} masih punya slot. Pilih dari daftar LO di bawah ini.</div>`}
      </div></div>
      <div class="card stack"><div class="eyebrow">Ketentuan</div>
        <ol class="rules">
          <li><span>Kamu bebas memilih LO masing-masing. Silakan janjian dengan teman supaya didampingi LO yang sama.</span></li>
          <li><span>Kalau sampai batas waktu kamu belum memilih, panitia wisuda yang akan memilihkan LO untukmu.</span></li>
          <li><span>Batas waktu pemilihan <b>Jumat, 16 Oktober 2026, 23.59 WIB</b>.</span></li>
        </ol>${countdownHTML()}</div>
    </div>
    <div>
      <div class="list-head"><h2>LO ${p.him}</h2><span class="faint mono" style="font-size:12.5px">${LOS.filter(l=>l.him===p.him).length} LO · kuota ${S.quota} per LO</span></div>
      <div class="list-head"><div class="search">${I.search}<input class="inp" id="q" type="search" placeholder="Cari nama LO atau nama temanmu" value="${esc(S.q)}" aria-label="Cari LO atau teman"></div>
        <div class="chips">${[["semua","Semua"],["slot","Masih ada slot"],["kosong","Masih kosong"]].map(([k,t])=>`<button class="chip" data-act="flt" data-f="${k}" aria-pressed="${S.flt===k}">${t}</button>`).join("")}</div></div>
      <div class="lo-list" id="lo-list">${listLOs()}</div>
    </div>
  </div>
  <section class="sec grid2">
    <div><h2>Request khusus</h2><p class="muted" style="margin:0 0 12px;font-size:14px">Untuk kasus di luar ketentuan, misalnya 5 orang ingin satu LO, atau 6 wisudawan ingin 3 LO yang bersahabat. Panitia akan meninjau dan mengabarkan hasilnya di sini.</p>
      ${myReqs.length?`<div class="stack" style="gap:10px"><div class="eyebrow">Request yang melibatkan kamu</div>${myReqs.map(r=>reqCard(r,false)).join("")}</div>`:`<div class="empty-list" style="padding:18px;font-size:14px">Belum ada request yang melibatkan kamu.</div>`}</div>
    ${reqForm()}
  </section></div>`}

function reqForm(){const d=S.draft,him=PRODI[S.me.prodi].him;
  const loS=d.loQ.trim()?LOS.filter(l=>l.him===him&&!d.los.includes(l.id)&&l.nama.toLowerCase().includes(d.loQ.toLowerCase())).slice(0,6):[];

    <div class="f" style="display:grid;gap:6px;font-weight:600;font-size:13.5px"><label for="rlo">LO yang diminta <span class="faint" style="font-weight:400">(bisa lebih dari satu)</span></label>
      ${d.los.length?`<div class="tag-in">${d.los.map(id=>`<span class="tag">${esc(LBY[id].nama)}<button type="button" data-act="rm-lo" data-id="${id}" aria-label="Hapus">×</button></span>`).join("")}</div>`:""}
      <input class="inp" id="rlo" placeholder="Ketik nama LO ${him}" value="${esc(d.loQ)}" autocomplete="off" ${locked()?"disabled":""}>
      ${loS.length?`<div class="sugg">${loS.map(l=>`<button type="button" data-act="add-lo" data-id="${l.id}"><span>${esc(l.nama)}</span><span class="mono faint">${loadOf(l.id)}/${cap(l)}</span></button>`).join("")}</div>`:""}</div>
    <div class="f" style="display:grid;gap:6px;font-weight:600;font-size:13.5px"><label for="rnim">NIM teman yang ikut</label>
      ${d.teman.length?`<div class="tag-in">${d.teman.map(n=>`<span class="tag"><span class="mono">${n}</span> ${esc(first(GBY[n].nama))}<button type="button" data-act="rm-nim" data-id="${n}" aria-label="Hapus">×</button></span>`).join("")}</div>`:""}
      <div class="row" style="flex-wrap:nowrap"><input class="inp mono" id="rnim" inputmode="numeric" maxlength="8" placeholder="8 digit NIM" value="${esc(d.nimQ)}" autocomplete="off" ${locked()?"disabled":""}><button type="button" class="btn ghost" data-act="add-nim" ${locked()?"disabled":""}>Tambah</button></div>
      ${d.err?`<div class="note err" style="font-weight:400">${d.err}</div>`:""}</div>
    <label class="f" for="rk">Keterangan<textarea class="inp" id="rk" placeholder="Ceritakan alasanmu dan siapa saja yang terlibat" ${locked()?"disabled":""}>${esc(d.ket)}</textarea></label>
    <button class="btn block" type="submit" ${locked()?"disabled":""}>${locked()?"Pengajuan ditutup":"Kirim request"}</button></form>`}

function reqCard(r,admin){const by=GBY[r.by];
  const ppl=[r.by,...r.teman].map(n=>GBY[n]);
  return `<div class="req"><div class="top"><div><b>${esc(r.jenis)}</b><div class="faint mono" style="font-size:12px">${r.id} · ${fmtT(r.t)}</div></div>${statusPill(r.status)}</div>
    <dl class="kv"><dt>Pengaju</dt><dd>${esc(by.nama)} <span class="mono faint">${by.nim}</span></dd>
    <dt>Wisudawan</dt><dd>${ppl.map(g=>esc(g.nama.split(" ").slice(0,2).join(" "))).join(", ")} <span class="faint">(${ppl.length} orang)</span></dd>
    <dt>LO diminta</dt><dd>${r.los.map(id=>`${esc(LBY[id].nama)} <span class="mono faint">${loadOf(id)}/${cap(LBY[id])}</span>`).join("<br>")}</dd>
    <dt>Keterangan</dt><dd>${esc(r.ket)}</dd>
    ${r.note&&!admin?`<dt>Catatan panitia</dt><dd>${esc(r.note)}</dd>`:""}</dl>
    ${admin?`<label class="f" for="note-${r.id}" style="font-weight:500">Catatan panitia<textarea class="inp" id="note-${r.id}" style="min-height:60px" placeholder="Terlihat oleh wisudawan">${esc(r.note)}</textarea></label>
      <div class="row">
        ${r.status==="menunggu"?`<button class="btn sm" data-act="req-set" data-id="${r.id}" data-s="disetujui">Setujui</button><button class="btn sm danger" data-act="req-set" data-id="${r.id}" data-s="ditolak">Tolak</button>`:""}
        ${r.status==="disetujui"?`<button class="btn sm" data-act="req-apply" data-id="${r.id}">Tetapkan ke LO</button><button class="btn sm ghost" data-act="req-set" data-id="${r.id}" data-s="selesai">Tandai selesai</button>`:""}
        ${r.status!=="menunggu"?`<button class="btn sm ghost" data-act="req-set" data-id="${r.id}" data-s="menunggu">Kembalikan ke menunggu</button>`:""}
      </div>`:""}</div>`}

  <div class="tabs" role="tablist">${tabs.map(([k,t,c])=>`<button role="tab" aria-selected="${S.tab===k}" data-act="tab" data-t="${k}">${t}${c?`<span class="count">${c}</span>`:""}</button>`).join("")}</div>
  <div id="tabbody">${({ringkasan:tRing,wisudawan:tWis,request:tReq,lo:tLo,export:tExp,atur:tAtur,log:tLog})[S.tab]()}</div></div>`}
function tRing(){
  const per=p=>{const all=GRADS.filter(g=>g.prodi===p);const done=all.filter(g=>S.assign.has(g.nim)).length;return{all:all.length,done}};
  const m=per("190"),k=per("192"),tot=m.done+k.done;
  const hist=him=>{const b=[0,0,0,0,0];LOS.filter(l=>l.him===him).forEach(l=>{const n=loadOf(l.id);b[Math.min(n,4)]++});return b};
  const H=him=>{const b=hist(him),mx=Math.max(...b,1);return `<div class="card stack"><div class="row" style="justify-content:space-between"><b>Beban LO ${him}</b><span class="faint mono" style="font-size:12px">jumlah LO per beban</span></div>
    <div class="hist">${b.map((v,i)=>`<div><span class="v">${v}</span><div class="col${i>3?" over":""}" style="height:${v/mx*90}px"></div><span class="l">${i<4?i+" orang":"> 3"}</span></div>`).join("")}</div></div>`};
  const cards=[["Sudah memilih",tot,248],["Manajemen",m.done,m.all],["Kewirausahaan",k.done,k.all]];
  return `<div class="stack" style="gap:16px">
  <div class="stats">${cards.map(([t,a,b])=>`<div class="stat"><span class="eyebrow">${t}</span><span class="n">${a}<small> / ${b}</small></span><div class="bar"><i style="width:${a/b*100}%"></i></div><span class="faint" style="font-size:12.5px">${b-a} belum memilih</span></div>`).join("")}
    <div class="stat"><span class="eyebrow">${locked()?"Pemilihan ditutup":"Sisa waktu"}</span>${countdownHTML()}</div></div>
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${H("KMM")}${H("IMK")}</div>
  <div class="card stack"><div class="row" style="justify-content:space-between"><div><b>Tempatkan otomatis</b><div class="muted" style="font-size:13.5px">Isi ${248-tot} wisudawan yang belum memilih ke LO himpunan yang sama dengan beban paling rendah. Hasilnya tetap bisa dikoreksi manual.</div></div>
    <button class="btn" data-act="auto" ${locked()&&248-tot>0?"":"disabled"}>Tempatkan otomatis</button></div>
    ${locked()?"":`<div class="note info">Tombol aktif setelah batas waktu. Gunakan "Simulasikan lewat deadline" di bar atas untuk mencoba.</div>`}</div></div>`}
function tWis(){const q=S.aq.trim().toLowerCase();
  let arr=GRADS.filter(g=>!q||g.nama.toLowerCase().includes(q)||g.nim.includes(q));
  if(S.aflt==="belum")arr=arr.filter(g=>!S.assign.has(g.nim));if(S.aflt==="sudah")arr=arr.filter(g=>S.assign.has(g.nim));
  return `<div class="list-head"><div class="search">${I.search}<input class="inp" id="aq" type="search" placeholder="Cari nama atau NIM" value="${esc(S.aq)}"></div>
    <div class="chips">${[["semua","Semua"],["belum","Belum memilih"],["sudah","Sudah"]].map(([k,t])=>`<button class="chip" data-act="aflt" data-f="${k}" aria-pressed="${S.aflt===k}">${t}</button>`).join("")}</div></div>
  <div class="tbl-wrap"><table><thead><tr><th>NIM</th><th>Nama</th><th>Prodi</th><th>LO</th><th>Sumber</th><th></th></tr></thead><tbody id="wis-body">
  ${arr.slice(0,60).map(g=>{const a=S.assign.get(g.nim);return `<tr><td class="mono">${g.nim}</td><td>${esc(g.nama)}${CATATAN[g.nim]?`<div><span class="pill warn">${esc(CATATAN[g.nim])}</span></div>`:""}</td><td>${PRODI[g.prodi].nama}</td>
    <td>${a?esc(LBY[a.lo].nama):'<span class="faint">Belum</span>'}</td><td>${a?SRC[a.src]:""}</td><td><button class="btn sm ghost" data-act="adm-edit" data-nim="${g.nim}">Atur</button></td></tr>`}).join("")}
  </tbody></table></div><p class="faint" style="font-size:12.5px">Menampilkan ${Math.min(60,arr.length)} dari ${arr.length} wisudawan.</p>`}
function tReq(){const order={menunggu:0,disetujui:1,selesai:2,ditolak:3};
  return `<div class="stack">${[...S.reqs].sort((a,b)=>order[a.status]-order[b.status]).map(r=>reqCard(r,true)).join("")}</div>`}
function tLo(){return `<div class="list-head"><p class="muted" style="margin:0;flex:1;font-size:14px">Kode akses dibuat otomatis untuk tiap LO. Bagikan lewat japri, bukan di grup.</p>
  <button class="btn ghost sm" data-act="copy-codes">Salin semua kode</button><button class="btn ghost sm" data-act="regen">Buat ulang kode</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>Himpunan</th><th>Nama LO</th><th>Beban</th><th>Kuota</th><th>Kode akses</th></tr></thead><tbody>
  ${LOS.map(l=>{const n=loadOf(l.id);return `<tr><td class="mono">${l.him}</td><td>${esc(l.nama)}</td><td>${seats(n,cap(l))} <span class="mono">${n}</span></td><td class="mono">${cap(l)}${l.quota!=null?" *":""}</td><td class="mono">${l.code}</td></tr>`}).join("")}</tbody></table></div>`}
function csv(){const rows=[["NIM","Nama","Prodi","LO","Himpunan LO","Sumber penetapan"]];
  GRADS.forEach(g=>{const a=S.assign.get(g.nim);rows.push([g.nim,g.nama,PRODI[g.prodi].nama,a?LBY[a.lo].nama:"",a?LBY[a.lo].him:"",a?SRC[a.src]:"Belum ada"])});
  return rows.map(r=>r.map(c=>/[",\n]/.test(c)?`"${c.replace(/"/g,'""')}"`:c).join(",")).join("\n")}
function tExp(){const c=csv().split("\n");
  return `<div class="stack"><div class="row"><button class="btn" data-act="dl" data-f="CSV">Unduh CSV</button><button class="btn ghost" data-act="dl" data-f="Excel">Unduh Excel</button><span class="faint" style="font-size:13px">${c.length-1} baris · urut NIM</span></div>
  <div class="tbl-wrap"><table><thead><tr>${c[0].split(",").map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>
  ${GRADS.slice(0,12).map(g=>{const a=S.assign.get(g.nim);return `<tr><td class="mono">${g.nim}</td><td>${esc(g.nama)}</td><td>${PRODI[g.prodi].nama}</td><td>${a?esc(LBY[a.lo].nama):""}</td><td class="mono">${a?LBY[a.lo].him:""}</td><td>${a?SRC[a.src]:'<span class="faint">Belum ada</span>'}</td></tr>`}).join("")}
  </tbody></table></div><p class="faint" style="font-size:12.5px">Pratinjau 12 baris pertama.</p></div>`}
function tAtur(){const dl=new Date(S.deadline.getTime()+7*3600e3).toISOString().slice(0,16);
  return `<form class="card stack" data-form="atur" style="max-width:520px">
  <label class="f" for="kq">Kuota default per LO<input class="inp mono" id="kq" type="number" min="1" max="10" value="${S.quota}"></label>
  <label class="f" for="kd">Batas waktu pemilihan (WIB)<input class="inp mono" id="kd" type="datetime-local" value="${dl}"></label>
  <div class="note info">Mengurangi kuota tidak mengeluarkan wisudawan yang sudah memilih. LO yang bebannya di atas kuota baru akan ditandai.</div>
  <button class="btn" type="submit">Simpan pengaturan</button></form>`}
function tLog(){return `<div class="tbl-wrap"><table><thead><tr><th>Waktu</th><th>Pelaku</th><th>Aksi</th><th>Wisudawan</th><th>Detail</th></tr></thead><tbody>
  ${S.logs.slice(0,80).map(l=>`<tr><td class="mono" style="white-space:nowrap">${fmtT(l.t)}</td><td>${esc(l.actor)}</td><td>${l.action}</td><td>${l.nim?`${esc(GBY[l.nim].nama.split(" ").slice(0,2).join(" "))} <span class="mono faint">${l.nim}</span>`:""}</td>
  <td>${l.from?esc(LBY[l.from].nama):""}${l.from&&l.to?" → ":""}${l.to?esc(LBY[l.to].nama):""}${l.extra?esc(l.extra):""}</td></tr>`).join("")}</tbody></table></div>`}

/* ===== Render & interaksi ===== */
const app=document.getElementById("app"),layer=document.getElementById("layer");
function render(){
  const v={home:vHome,prodi:vProdi,login:vLogin,dash:vDash,"lo-login":vLoLogin,lo:vLo,"admin-login":vAdminLogin,admin:vAdmin}[S.view];
  app.innerHTML=v();tick();
  document.querySelectorAll(".flora").forEach(f=>f.style.display=S.view==="home"?"":"none");
}
function toast(msg){layer.querySelector(".toast")?.remove();const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;layer.appendChild(t);setTimeout(()=>t.remove(),2800)}
function modal(html,onYes){closeModal();const d=document.createElement("div");d.className="scrim";d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  d.addEventListener("click",e=>{if(e.target===d||e.target.closest("[data-x]"))closeModal();const y=e.target.closest("[data-yes]");if(y){onYes(d,y);}});layer.appendChild(d);d.querySelector("button,select,input")?.focus()}
function closeModal(){layer.querySelector(".scrim")?.remove()}
function tick(){const ms=Math.max(0,S.deadline.getTime()-now());const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
  document.querySelectorAll("[data-cd]").forEach(c=>{c.querySelector("[data-d]").textContent=d;c.querySelector("[data-h]").textContent=String(h).padStart(2,"0");c.querySelector("[data-m]").textContent=String(m).padStart(2,"0");c.querySelector("[data-s]").textContent=String(s).padStart(2,"0")})}
setInterval(tick,1000);
const go=v=>{S.view=v;window.scrollTo(0,0);render()};

function pick(id){const me=S.me,lo=LBY[id],a=S.assign.get(me.nim);
  if(locked())return toast("Pemilihan sudah ditutup.");
  if(loadOf(id)>=cap(lo))return toast("LO ini baru saja penuh. Pilih LO lain.");
  const others=membersOf(id);
  modal(`<span class="eyebrow">${a?"Pindah LO":"Konfirmasi pilihan"}</span><h3>${a?`Pindah ke ${esc(lo.nama)}?`:`Pilih ${esc(lo.nama)}?`}</h3>
    <p class="muted" style="margin:0;font-size:14px">${a?`Slot kamu di <b>${esc(LBY[a.lo].nama)}</b> akan dilepas dan bisa diambil orang lain.`:"Kamu masih bisa membatalkan atau pindah sebelum batas waktu."}
    ${others.length?`<br>Sudah memilih: ${others.map(x=>esc(x.nama)).join(", ")}.`:""}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-x>Batal</button><button class="btn" data-yes>${a?"Ya, pindah":"Ya, pilih"}</button></div>`,()=>{
    closeModal();if(loadOf(id)>=cap(lo))return toast("LO ini baru saja penuh. Pilih LO lain.");
    S.assign.set(me.nim,{lo:id,src:"sendiri"});log(me.nama,a?"pindah":"memilih",me.nim,a?.lo,id);
    render();toast(a?`Kamu pindah ke ${lo.nama}.`:`Kamu memilih ${lo.nama}.`)})}

function adminEdit(nim){const g=GBY[nim],a=S.assign.get(nim),him=PRODI[g.prodi].him;
  modal(`<span class="eyebrow">Atur LO · ${PRODI[g.prodi].nama}</span><h3>${esc(g.nama)}</h3><span class="mono faint">${g.nim}</span>
    <label class="f" for="ae-lo">LO ${him}<select class="inp" id="ae-lo">${LOS.filter(l=>l.him===him).map(l=>{const n=loadOf(l.id);return `<option value="${l.id}" ${a?.lo===l.id?"selected":""}>${esc(l.nama)} (${n}/${cap(l)})</option>`}).join("")}</select></label>
    <label class="row" style="font-size:14px;gap:8px"><input type="checkbox" id="ae-over"> Izinkan melebihi kuota</label>
    <label class="f" for="ae-src">Sumber<select class="inp" id="ae-src"><option value="panitia">Panitia</option><option value="request">Request</option></select></label>
    <div class="row" style="justify-content:space-between">${a?`<button class="btn danger" data-yes data-k="rel">Lepaskan dari LO</button>`:"<span></span>"}<div class="row"><button class="btn ghost" data-x>Batal</button><button class="btn" data-yes data-k="save">Simpan</button></div></div>`,(d,y)=>{
    const k=y.dataset.k;
    if(k==="rel"){S.assign.delete(nim);log("Panitia","melepaskan",nim,a.lo,null);closeModal();render();return toast("Wisudawan dilepas dari LO.")}
    const id=d.querySelector("#ae-lo").value,over=d.querySelector("#ae-over").checked,lo=LBY[id];
    if(a?.lo!==id&&loadOf(id)>=cap(lo)&&!over)return toast("LO ini penuh. Centang izinkan melebihi kuota.");
    S.assign.set(nim,{lo:id,src:d.querySelector("#ae-src").value});log("Panitia",a?"memindahkan":"menetapkan",nim,a?.lo,id);closeModal();render();toast("Penetapan disimpan.")})}

document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const A=b.dataset.act;
  switch(A){
  case"go":go(b.dataset.to);break;
  case"prodi":S.prodi=b.dataset.p;S.login={nim:"",err:null,step:"nim"};go("login");break;
  case"google":S.login.step="wait";render();setTimeout(()=>{S.me=GBY[S.login.nim];S.q="";S.flt="semua";go("dash");toast("Berhasil masuk.")},900);break;
  case"google-fail":S.login.err="Akun Google ini tidak terdaftar untuk NIM tersebut. Masuk dengan email yang kamu daftarkan, atau minta kode masuk ke panitia.";render();break;
  case"login-reset":S.login={nim:"",err:null,step:"nim"};render();break;
  case"manual":S.login.step="manual";S.login.err=null;render();break;
  case"login-google":S.login.step="google";render();break;
  case"copylink":navigator.clipboard?.writeText(location.href).then(()=>toast("Link disalin."),()=>toast("Salin link dari bilah alamat."));break;
  case"logout":S.me=null;S.lo=null;S.admin=false;go("home");break;
  case"pick":pick(b.dataset.lo);break;
  case"cancel":modal(`<span class="eyebrow">Batalkan pilihan</span><h3>Lepas ${esc(LBY[S.assign.get(S.me.nim).lo].nama)}?</h3><p class="muted" style="margin:0;font-size:14px">Slotmu akan terbuka untuk orang lain. Kalau sampai batas waktu kamu belum memilih lagi, panitia yang akan memilihkan.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-x>Tidak jadi</button><button class="btn danger" data-yes>Ya, batalkan</button></div>`,()=>{const a=S.assign.get(S.me.nim);S.assign.delete(S.me.nim);log(S.me.nama,"membatalkan",S.me.nim,a.lo,null);closeModal();render();toast("Pilihan LO dibatalkan.")});break;
  case"flt":S.flt=b.dataset.f;render();break;
  case"add-lo":S.draft.los.push(b.dataset.id);S.draft.loQ="";render();document.getElementById("rlo")?.focus();break;
  case"rm-lo":S.draft.los=S.draft.los.filter(x=>x!==b.dataset.id);render();break;
  case"rm-nim":S.draft.teman=S.draft.teman.filter(x=>x!==b.dataset.id);render();break;
  case"add-nim":{const d=S.draft,n=d.nimQ.trim(),g=GBY[n];d.err=null;
    if(!/^\d{8}$/.test(n))d.err="NIM harus 8 digit angka.";else if(!g)d.err=`NIM ${esc(n)} tidak ada di data wisudawan Oktober 2026.`;
    else if(n===S.me.nim)d.err="Itu NIM kamu sendiri.";else if(g.prodi!==S.me.prodi)d.err=`${esc(g.nama)} terdaftar di ${PRODI[g.prodi].nama}, jadi tidak bisa memakai LO ${PRODI[S.me.prodi].him}.`;
    else if(d.teman.includes(n))d.err="NIM ini sudah ditambahkan.";else{d.teman.push(n);d.nimQ=""}
    render();document.getElementById("rnim")?.focus();break}
  case"tab":S.tab=b.dataset.t;render();break;
  case"aflt":S.aflt=b.dataset.f;render();break;
  case"adm-edit":adminEdit(b.dataset.nim);break;
  case"req-set":{const r=S.reqs.find(x=>x.id===b.dataset.id);r.note=document.getElementById("note-"+r.id)?.value??r.note;r.status=b.dataset.s;log("Panitia","request "+r.status,r.by,null,null," "+r.id);render();toast(`Request ${r.id}: ${r.status}.`);break}
  case"req-apply":{const r=S.reqs.find(x=>x.id===b.dataset.id);const ppl=[r.by,...r.teman];
    ppl.forEach((n,i)=>{const id=r.los[i%r.los.length];const a=S.assign.get(n);S.assign.set(n,{lo:id,src:"request"});log("Panitia","menetapkan (request)",n,a?.lo,id)});
    render();toast(`${ppl.length} wisudawan ditetapkan ke ${r.los.length} LO.`);break}
  case"auto":{let c=0;GRADS.filter(g=>!S.assign.has(g.nim)).forEach(g=>{const pool=LOS.filter(l=>l.him===PRODI[g.prodi].him).sort((a,b)=>loadOf(a.id)-loadOf(b.id));S.assign.set(g.nim,{lo:pool[0].id,src:"otomatis"});log("Sistem","menempatkan otomatis",g.nim,null,pool[0].id);c++});render();toast(`${c} wisudawan ditempatkan otomatis.`);break}
  case"copy-codes":navigator.clipboard?.writeText(LOS.map(l=>`${l.him},${l.nama},${l.code}`).join("\n")).then(()=>toast("Daftar kode disalin."),()=>toast("Gagal menyalin."));break;
  case"regen":toast("Di versi asli, kode lama langsung tidak berlaku.");break;
  case"dl":toast(`Di versi asli, file ${b.dataset.f} akan terunduh.`);break;
  case"fill-lo":document.getElementById("locode").value=b.textContent;break;
  case"pv-home":go("home");break;
  case"pv-wis":S.me=GBY["19023045"];S.prodi="190";go("dash");break;
  case"pv-lo":S.lo=LOS[31];go("lo");break;
  case"pv-admin":S.admin=true;go("admin");break;
  case"pv-dead":S.simAfter=!S.simAfter;b.setAttribute("aria-pressed",S.simAfter);render();toast(S.simAfter?"Simulasi: batas waktu sudah lewat.":"Simulasi dimatikan.");break;
  case"pv-theme":{const o=["system","light","dark"];S.theme=o[(o.indexOf(S.theme)+1)%3];if(S.theme==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",S.theme);b.textContent="Tema: "+({system:"sistem",light:"terang",dark:"gelap"})[S.theme];break}
  }});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.dataset.form;
  if(f==="nim"){const n=document.getElementById("nim").value.trim();S.login.nim=n;const g=GBY[n];
    if(!/^\d{8}$/.test(n))S.login.err="NIM harus 8 digit angka.";
    else if(!g)S.login.err="NIM ini tidak ada di data wisudawan Oktober 2026. Hubungi panitia LO untuk memastikan datamu.";
    else if(g.prodi!==S.prodi)S.login.err=`NIM ini terdaftar di prodi ${PRODI[g.prodi].nama}. <button class="linkbtn" data-act="prodi" data-p="${g.prodi}">Pindah ke ${PRODI[g.prodi].nama}</button>`;
    else{S.login.err=null;S.login.step="google"}
    render();if(S.login.step==="nim"&&S.login.err&&g&&g.prodi!==S.prodi){}return}
  if(f==="manual"){const v=document.getElementById("mcode").value.trim();if(v.length<6)return toast("Kode masuk terdiri dari 6 karakter.");S.me=GBY[S.login.nim];go("dash");return}
  if(f==="lo"){const v=document.getElementById("locode").value.trim().toUpperCase();const lo=LOS.find(l=>l.code===v);
    if(!lo){document.getElementById("lo-err").innerHTML=`<div class="note err">Kode akses tidak dikenali. Periksa lagi atau hubungi panitia.</div>`;return}S.lo=lo;go("lo");return}
  if(f==="admin"){S.admin=true;go("admin");return}
  if(f==="atur"){const q=+document.getElementById("kq").value;const d=document.getElementById("kd").value;if(q>=1)S.quota=q;if(d)S.deadline=new Date(d+":00+07:00");log("Panitia","mengubah pengaturan",null,null,null,`kuota ${S.quota}`);render();toast("Pengaturan disimpan.");return}
  if(f==="req"){const d=S.draft;d.jenis=document.getElementById("rj").value;d.ket=document.getElementById("rk").value.trim();
    if(!d.jenis)return toast("Pilih jenis permintaan dulu.");if(!d.los.length)return toast("Tambahkan minimal satu LO.");if(!d.ket)return toast("Isi keterangan singkat.");
    const id="R-0"+(15+S.reqs.length);S.reqs.unshift({id,by:S.me.nim,jenis:d.jenis,los:[...d.los],teman:[...d.teman],ket:d.ket,status:"menunggu",note:"",t:now()});
    log(S.me.nama,"mengirim request",S.me.nim,null,null," "+id);S.draft={jenis:"",los:[],teman:[],ket:"",loQ:"",nimQ:"",err:null};render();toast("Request terkirim. Pantau statusnya di halaman ini.");}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="q"){S.q=t.value;document.getElementById("lo-list").innerHTML=listLOs()}
  if(t.id==="aq"){S.aq=t.value;const pos=t.selectionStart;render();const n=document.getElementById("aq");n.focus();n.setSelectionRange(pos,pos)}
  if(t.id==="rlo"){S.draft.loQ=t.value;S.draft.jenis=document.getElementById("rj").value;S.draft.ket=document.getElementById("rk").value;const pos=t.selectionStart;render();const n=document.getElementById("rlo");n.focus();n.setSelectionRange(pos,pos)}
  if(t.id==="rnim"){S.draft.nimQ=t.value.replace(/\D/g,"")}
  if(t.id==="rk")S.draft.ket=t.value;
});
document.addEventListener("change",e=>{if(e.target.id==="rj")S.draft.jenis=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(e.key==="Enter"&&e.target.id==="rnim"){e.preventDefault();document.querySelector('[data-act="add-nim"]').click()}});
render();
</script>
